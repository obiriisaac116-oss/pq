services:
  - type: web
    name: past-questions
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
      - key: NEXT_PUBLIC_PHONE_NUMBER
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: publish-scheduled-papers
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: echo done
    startCommand: >
      curl -sf -X GET $NEXT_PUBLIC_SITE_URL/api/cron/publish -H 'x-cron-secret: '$CRON_SECRET
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        fromGroup: past-questions
      - key: CRON_SECRET
        fromGroup: past-questions
